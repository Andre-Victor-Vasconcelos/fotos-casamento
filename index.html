<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Casamento | Galeria de Fotos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* ================= CSS (ESTILOS E DESIGN) ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: #faf8f5; color: #333; }

        header {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            height: 70vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; color: #fff; padding: 20px;
        }
        header h1 { font-family: 'Playfair Display', serif; font-size: 4rem; margin-bottom: 10px; text-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        header p { font-size: 1.2rem; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; }

        .gallery-container { max-width: 1200px; margin: 50px auto; padding: 0 20px; text-align: center; }
        .gallery-container h2 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 10px; color: #5a4b41; }
        .gallery-container p.subtitle { margin-bottom: 40px; color: #777; font-style: italic; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%; height: 350px; object-fit: cover; border-radius: 8px; cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background-color: #e9e9e9; /* Cor de fundo enquanto a foto carrega */
        }
        .gallery img:hover { transform: scale(1.03); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }

        /* Botão Carregar Mais */
        #btn-load-more {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            background-color: #5a4b41;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #btn-load-more:hover { background-color: #3e332c; }

        footer { background-color: #5a4b41; color: #fff; text-align: center; padding: 30px 20px; font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-top: 50px; }

        .lightbox { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; flex-direction: column; }
        .lightbox img { max-width: 90%; max-height: 85%; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); animation: fadeIn 0.3s ease; }
        .close-btn { position: absolute; top: 20px; right: 40px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close-btn:hover { color: #ccc; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @media (max-width: 768px) { header h1 { font-size: 2.5rem; } .gallery { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } .gallery img { height: 200px; } }
    </style>
</head>
<body>

    <header>
        <h1>André & Maria</h1>
        <p>Nosso Felizes para Sempre • 20/06/2026 </p>
    </header>

    <main class="gallery-container">
        <h2>Nossas Lembranças</h2>
        <p class="subtitle">Clique nas fotos para ampliar e reviver esse dia mágico conosco.</p>
        
        <!-- A galeria começa vazia, o Javascript vai preencher ela -->
        <div class="gallery" id="gallery"></div>

        <!-- Botão para carregar as fotos aos poucos -->
        <button id="btn-load-more">Ver mais fotos</button>
    </main>

    <footer>
        <p>Obrigado por fazer parte da nossa história! ♥</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="Foto Ampliada">
    </div>

    <!-- ================= JAVASCRIPT (MÁGICA DAS 739 FOTOS) ================= -->
    <script>
        const gallery = document.getElementById('gallery');
        const btnLoadMore = document.getElementById('btn-load-more');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const closeBtn = document.getElementById('close-btn');

        // ==== CONFIGURAÇÕES ====
        const totalFotos = 739; // Total exato de fotos que você tem
        const fotosPorVez = 30; // Quantas fotos vão aparecer a cada clique
        let fotoAtual = 1;

        // Função que cria as fotos na tela
        function carregarFotos() {
            let limite = fotoAtual + fotosPorVez - 1;
            if (limite > totalFotos) { limite = totalFotos; }

            for (let i = fotoAtual; i <= limite; i++) {
                const img = document.createElement('img');
                
                // ATENÇÃO: O nome do arquivo precisa estar EXATAMENTE como no seu computador
                // O código abaixo procura por "Foto 1.JPG", "Foto 2.JPG", etc.
                img.src = `Foto ${i}.jpg`; 
                img.alt = `Foto do Casamento ${i}`;
                
                // Atributos para o celular não travar (deixa leve)
                img.loading = "lazy";
                img.decoding = "async";

                // Adiciona o clique para abrir no telão (lightbox)
                img.addEventListener('click', () => {
                    lightbox.style.display = 'flex';
                    lightboxImg.src = img.src;
                });

                // Coloca a foto na página
                gallery.appendChild(img);
            }

            fotoAtual = limite + 1;

            // Se acabarem as fotos, esconde o botão
            if (fotoAtual > totalFotos) {
                btnLoadMore.style.display = 'none';
            }
        }

        // Carrega as primeiras fotos assim que o site abre
        carregarFotos();

        // Faz o botão carregar mais fotos ao clicar
        btnLoadMore.addEventListener('click', carregarFotos);

        // Funções do Lightbox
        closeBtn.addEventListener('click', () => lightbox.style.display = 'none');
        lightbox.addEventListener('click', (e) => {
            if (e.target !== lightboxImg) lightbox.style.display = 'none';
        });
    </script>
</body>
</html>
